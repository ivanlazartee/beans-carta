<style>
  /* ===== Paleta Beans (sacada de sus cartas) ===== */
  :root{
    --caramel:#A87C4F;
    --caramel-2:#C19A6B;
    --caramel-soft:#F3EADF;
    --paper:#FBF8F3;
    --card:#FFFFFF;
    --ink:#3B3530;
    --muted:#8A8178;
    --line:#E8DFD3;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Josefin Sans',sans-serif;background:#E7DFD4;color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:100px;overflow:hidden}

  /* ===== Header con grabado ===== */
  header{background:var(--caramel);height:190px;position:relative}
  header .engrave{position:absolute;inset:0;width:100%;height:100%;stroke:#6E4E2E;fill:none;stroke-width:1.2;stroke-linecap:round;opacity:.55}
  .logo{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);width:132px;height:132px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 0 0 6px var(--paper)}
  .logo svg{width:112px;height:112px}
  .logo .ring{fill:none;stroke:var(--caramel);stroke-width:1.5}
  .logo text{fill:var(--caramel);font-family:'Josefin Sans';font-weight:700;font-size:10.5px;letter-spacing:3px}
  .logo .b{font-family:'UnifrakturMaguntia';font-size:54px;letter-spacing:0;fill:var(--caramel)}
  .hello{margin:78px 22px 0;text-align:center}
  .hello .t{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--muted)}
  .hello .msg{margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:var(--caramel-soft);color:var(--caramel);font-weight:600;font-size:14px;padding:9px 16px;border-radius:999px}
  .hello .msg i{width:8px;height:8px;border-radius:50%;background:var(--caramel);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}

  /* ===== Buscador ===== */
  .search{margin:18px 22px 6px;position:relative}
  .search input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:13px 16px 12px 42px;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .search input:focus{border-color:var(--caramel)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;stroke:var(--muted);fill:none;stroke-width:2}

  /* ===== Chips ===== */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 22px;position:sticky;top:0;background:var(--paper);z-index:5;scrollbar-width:none;border-bottom:1px solid transparent;transition:border-color .2s}
  .chips.stuck{border-color:var(--line)}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--caramel);background:transparent;border-radius:999px;padding:8px 14px 6px;font:inherit;font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--caramel);cursor:pointer}
  .chip.on{background:var(--caramel);color:#fff}

  /* ===== Tarjeta de sección con borde estampilla ===== */
  main{padding:6px 22px}
  .block{position:relative;background:var(--card);border-radius:4px;padding:26px 18px 10px;margin:18px 0 6px;scroll-margin-top:70px;
    filter:drop-shadow(0 1px 0 var(--line)) drop-shadow(0 0 0 var(--line));
    animation:in .35s ease both}
  .block::before{content:"";position:absolute;left:0;right:0;top:-7px;height:8px;
    background:radial-gradient(circle at 7px 8px,var(--card) 6.5px,transparent 7px) 0 0/14px 8px repeat-x}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .block h2{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--caramel)}
  .block h2 svg{width:20px;height:20px;stroke:var(--caramel);fill:none;stroke-width:1.4;flex:0 0 20px}
  .block .sub{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .block .note{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--caramel);background:var(--caramel-soft);padding:8px 10px;border-radius:8px;margin-top:12px;line-height:1.45}
  .block.partner h2{color:#24344D}
  .block.partner h2 svg{stroke:#24344D}

  .item{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item h3{font-size:14.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;line-height:1.3}
  .item p{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  .price{font-family:'DM Mono',monospace;font-weight:500;font-size:13.5px;white-space:nowrap;color:var(--ink);padding-top:1px}
  .badges{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 8px 2px;border-radius:999px;background:var(--caramel-soft);color:var(--caramel)}
  .badge.veg{background:#E8EDE2;color:#6B7D5C}
  .badge.tacc{background:#F6E9D6;color:#9A6A2E}
  .badge.promo{background:var(--caramel);color:#fff}

  /* Destacado (tipo Honey Matcha del PDF) */
  .featured{background:var(--caramel);color:#fff;border-radius:var(--radius);padding:16px 18px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;overflow:hidden}
  .featured small{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;opacity:.8}
  .featured h3{font-size:16px;letter-spacing:2px;text-transform:uppercase;margin-top:3px}
  .featured p{font-family:'DM Mono',monospace;font-size:12px;opacity:.9;margin-top:4px}
  .featured .price{color:#fff;font-size:15px}
  .featured svg{position:absolute;right:-14px;bottom:-18px;width:90px;stroke:#fff;fill:none;stroke-width:1.2;opacity:.18}

  .empty{text-align:center;color:var(--muted);padding:40px 0;font-family:'DM Mono',monospace;font-size:13px}
  .preview{margin:22px 22px 0;text-align:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--caramel);border:1.5px dashed var(--caramel-2);border-radius:var(--radius);padding:12px}
  footer{text-align:center;margin:28px 22px 0;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase}
  footer a{color:var(--caramel);text-decoration:none;font-weight:700}

  /* ===== Navegación inferior ===== */
  nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;background:#2F2925;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-radius:22px;z-index:10;box-shadow:0 10px 30px rgba(47,41,37,.35)}
  nav button{background:none;border:0;color:#B9AA9A;font:inherit;font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 0 6px;border-radius:15px;transition:background .2s,color .2s}
  nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:#fff;background:var(--caramel)}
</style>
</head>

  "meriendas|Pannico · Panadería creativa": ["Alfajor de almendras","Mini Rogel","Mini bomba de chocolate"],
  "meriendas|Sin TACC": ["Alfajor de chocolate"],
  "almuerzo|Platos": ["Pechuguitas Crispy","Medallones de cerdo crocantes","Churrasquito de filet","Sorrentinos de calabaza","Risotto de hongos"],
  "almuerzo|Tartas": ["Pollo y puerros"],
  "almuerzo|Ensaladas": ["Caesar con pollo","Salmón ahumado"],
  "almuerzo|Ciabattas": ["Vegetariana"],
  "almuerzo|Postres": ["Mini Lemon Pie","Copa Patagonia"],
  "bebidas|Batidos & limonadas": ["Frozen de maracuyá","Andino","Green Garden","Limonada de frutos rojos"],
  "bebidas|Jugos detox": ["Verde"],
  "bebidas|Bebidas": ["Agua con o sin gas","Stella Artois"]
};
if (DEMO) {
  Object.entries(MENU).forEach(([tabKey, t]) => t.blocks.forEach(b => {
    if (b.items) b.items = b.items.filter(i => (KEEP[tabKey+"|"+b.title] || []).includes(i[0]));
  }));
}

const BADGE = { veg:'<span class="badge veg">Veggie</span>', tacc:'<span class="badge tacc">Sin TACC</span>', promo:'<span class="badge promo">Promo *</span>' };
const money = n => "$" + n.toLocaleString("es-AR");
// Normaliza: minúsculas y sin acentos ("Café" -> "cafe")
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const slug = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-");

// ===== Abre la carta según la hora del celular =====
function tabByHour(){
  const h = new Date().getHours();
  if (h >= 12 && h < 16) return "almuerzo";
  if (h >= 16 && h < 20) return "meriendas";
  return "cafeteria";
}
let tab = tabByHour(), query = "";

function greet(){
  const h = new Date().getHours();
  const txt = { cafeteria:"¿Arrancamos con un café?", meriendas:"Hora de merendar", almuerzo:"Es hora de almorzar", bebidas:"Algo fresco para tomar" }[tab];
  document.getElementById("greet").textContent = (h<12?"Buen día · ":h<20?"Buenas tardes · ":"Buenas noches · ") + txt;
}

function renderNav(){
  nav.innerHTML = Object.entries(MENU).map(([k,v]) =>
    `<button class="${k===tab?'on':''}" data-tab="${k}"><svg viewBox="0 0 24 24">${v.icon}</svg>${v.label}</button>`).join("");
}

function renderChips(){
  const titles = MENU[tab].blocks.filter(b=>b.title).map(b=>b.title);
  chips.innerHTML = query ? "" : titles.map(t=>`<button class="chip" data-go="${slug(t)}">${t.split(" · ")[0]}</button>`).join("");
}

function itemHTML([name,desc,price,tags=[]]){
  return `<div class="item"><div><h3>${name}</h3>${desc?`<p>${desc}</p>`:""}${tags.length?`<div class="badges">${tags.map(t=>BADGE[t]).join("")}</div>`:""}</div><span class="price">${money(price)}</span></div>`;
}

function renderList(){
  let html = "";
  const tabs = query ? Object.values(MENU) : [MENU[tab]];
  tabs.forEach(t => t.blocks.forEach(b => {
    if (b.featured){
      if (!query || norm(b.name+" "+b.desc).includes(query))
        html += `<div class="featured"><div><small>Recomendado</small><h3>${b.name}</h3><p>${b.desc}</p></div><span class="price">${money(b.price)}</span><svg viewBox="0 0 24 24">${ICONS.cup}</svg></div>`;
      return;
    }
    const items = b.items.filter(i => norm(i[0]+" "+i[1]).includes(query));
    if (!items.length) return;
    html += `<section class="block ${b.partner?'partner':''}" id="${slug(b.title)}">
      <h2><svg viewBox="0 0 24 24">${ICONS.bean}</svg>${query ? t.label+" · "+b.title : b.title}</h2>
      ${b.sub?`<div class="sub">${b.sub}</div>`:""}
      ${b.note && !query?`<div class="note">${b.note}</div>`:""}
      ${items.map(itemHTML).join("")}</section>`;
  }));
  list.innerHTML = html || '<div class="empty">No encontramos eso en la carta ☕</div>';
}

function render(){ renderNav(); renderChips(); renderList(); greet(); }

const nav = document.getElementById("nav"), chips = document.getElementById("chips"), list = document.getElementById("list"), q = document.getElementById("q");

nav.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  tab = b.dataset.tab; query = ""; q.value = "";
  render(); window.scrollTo({top:0});
});
chips.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  document.getElementById(b.dataset.go)?.scrollIntoView({behavior:"smooth"});
});
q.addEventListener("input", e => { query = norm(e.target.value.trim()); renderChips(); renderList(); });

// Marca el chip de la sección visible mientras scrolleás
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.go === en.target.id));
    // Mueve SOLO la barra de chips en horizontal (no la página)
    const on = chips.querySelector(".chip.on");
    if (on) chips.scrollTo({ left: on.offsetLeft - chips.clientWidth/2 + on.clientWidth/2, behavior:"smooth" });
  });
}, { rootMargin:"-30% 0px -65% 0px" });
new MutationObserver(() => document.querySelectorAll(".block").forEach(s => spy.observe(s))).observe(list,{childList:true});
window.addEventListener("scroll", () => chips.classList.toggle("stuck", chips.getBoundingClientRect().top <= 0));

render();
</script>
</body>
</html>
